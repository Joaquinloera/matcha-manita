[build]
  publish = "."
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

[[redirects]]
  from = "/api/payments/create"
  to = "/.netlify/functions/create-payment-intent"
  status = 200
  force = true

[[headers]]
  for = "/api/*"

  [headers.values]
    Cache-Control = "no-store"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
