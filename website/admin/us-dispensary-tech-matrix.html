<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Matcha Manita | US Dispensary Technology Matrix</title><style>body{margin:0;background:#071b16;color:#eee1b9;font:16px system-ui}main{max-width:1100px;margin:auto;padding:2rem}h1{color:#ebc86d}input{background:#143329;border:1px solid #9e8750;color:white;padding:1rem;width:min(95%,420px)}table{width:100%;border-collapse:collapse;margin-top:1.5rem}th,td{padding:1rem;border-bottom:1px solid #52634c;text-align:left}a{color:#f0d07d}.note{border:1px solid #b29555;padding:1rem}</style></head><body><main><h1>US Dispensary Technology Matrix</h1><p class="note">Admin research reference only. Static public-source snapshot, not an authenticated admin system, confirmed partnership, connected payment processor or full dispensary list. No private credentials.</p><label for="filter">Filter providers and capabilities</label><p><input id="filter" type="search" placeholder="Search JARS, wallets, APIs…"></p><table><thead><tr><th>Operator</th><th>Technology capability</th><th>Status</th><th>Evidence</th></tr></thead><tbody id="matrix"></tbody></table><p id="count" aria-live="polite"></p></main><script>const data=[["JARS Cannabis","Web app, ordering, loyalty","https://jarscannabis.com/install"],["Curaleaf","Mobile app, pickup, rewards","https://curaleaf.com/download-our-app"],["Zen Leaf","Aeropay, app, loyalty","https://apps.apple.com/us/app/zen-leaf/id6448922214"],["Zen Leaf","Digital discount-voucher wallet","https://zenleafdispensaries.com/blog/rewards-app"],["Trulieve","Mobile app, rewards","https://www.trulieve.com/discover/blog/trulieve-mobile-app-georgia"],["RISE Dispensaries","Rewards loyalty program","https://risecannabis.com/rise-rewards/"],["The Apothecarium","BudClub loyalty","https://apothecarium.com/rewards/"],["Dutchie","POS API and integrations","https://api.pos.dutchie.com/"],["Treez","Retail API integrations","https://www.treez.io/integrations"],["Metrc","Track and trace API","https://www.metrc.com/track-and-trace-technology/metrc-connect/"],["OpenAI","AI developer API","https://developers.openai.com/api/reference/overview/"]];const tbody=document.getElementById("matrix"),input=document.getElementById("filter"),count=document.getElementById("count");function render(){tbody.replaceChildren();let shown=0;for(const [operator,cap,url] of data){if(!(operator+" "+cap).toLowerCase().includes(input.value.toLowerCase()))continue;shown++;const tr=document.createElement("tr");for(const v of [operator,cap,"Research only"]){const td=document.createElement("td");td.textContent=v;tr.append(td)}const td=document.createElement("td"),a=document.createElement("a");a.href=url;a.textContent="Source";a.target="_blank";a.rel="noopener noreferrer";td.append(a);tr.append(td);tbody.append(tr)}count.textContent=shown+" of "+data.length+" research findings displayed."}input.addEventListener("input",render);render();</script></body></html>
