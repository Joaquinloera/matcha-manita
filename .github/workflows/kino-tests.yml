name: KINO Matcha Manita integration tests
on:
  push:
    branches: [kino-premium-preview-20261008]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  adapter-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate BLAZE adapter with mock requests
        run: node --test tests/blaze-partner.test.mjs
