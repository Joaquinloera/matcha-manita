name: Matcha Manita Homepage Smoke Tests
on:
  push:
    branches: [kino-premium-preview-20261008]
  pull_request:
  workflow_dispatch:
jobs:
  homepage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify Page 1 and preserved storefront
        run: node tests/homepage-smoke.cjs
